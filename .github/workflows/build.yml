name: Crea le app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pillow
      - run: python -m pytest -q tests

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: TransferSending-Windows
          - os: macos-latest
            name: TransferSending-Mac-AppleSilicon
          - os: macos-15-intel
            name: TransferSending-Mac-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm TransferSending.spec

      - name: Prepara zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/TransferSending.exe -DestinationPath "${{ matrix.name }}.zip"

      - name: Prepara zip (Mac)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - dist/TransferSending.app
          ditto -c -k --keepParent dist/TransferSending.app "${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.zip

  # Pubblica le app nella pagina "Releases" (versione letta da transfersending/__init__.py)
  release:
    # pubblica anche se una build manca (es. GitHub senza Mac disponibili)
    if: always() && needs.test.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: echo "v=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' transfersending/__init__.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: TransferSending ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Scarica il file per il tuo computer:
            - **Windows** → `TransferSending-Windows.zip`
            - **Mac con chip Apple (M1–M4)** → `TransferSending-Mac-AppleSilicon.zip`
            - **Mac Intel** → `TransferSending-Mac-Intel.zip`

            Istruzioni nel [README](https://github.com/${{ github.repository }}#readme).
          files: out/*.zip
          overwrite_files: true
